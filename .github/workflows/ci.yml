# Wasden Watch CI/CD Pipeline
# Runs lint and tests on push to main and pull requests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python Backend Linting and Tests
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check . --select=E,F,W --ignore=E501

      - name: Type check imports
        run: |
          # Verify all imports resolve
          python -c "from app.main import app; print('Backend imports OK')"
        env:
          TRADING_MODE: paper
          USE_MOCK_DATA: "true"

      - name: Run tests
        run: |
          # Run pytest if tests exist
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v --tb=short
          else
            echo "No tests found - skipping"
          fi
        env:
          TRADING_MODE: paper
          USE_MOCK_DATA: "true"

  # Frontend Linting and Build
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Dependency Vulnerability Scan (Python + Node)
  # Fails CI on known CVEs in production dependencies.
  # - Python: pip-audit against OSV.dev (no GitHub token required)
  # - Node:   npm audit, HIGH/CRITICAL only, prod deps only
  # Triage workflow on failure: bump version if safe, otherwise add the
  # advisory ID to .github/pip-audit-allowlist.txt with a dated rationale.
  security:
    name: Security (Dependency Vuln Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (Python deps, OSV database, strict)
        run: |
          # Build --ignore-vuln flags from the allowlist file, if any
          # non-comment, non-blank entries exist.
          IGNORE_FLAGS=""
          ALLOWLIST=".github/pip-audit-allowlist.txt"
          if [ -f "$ALLOWLIST" ]; then
            while IFS= read -r line; do
              # strip inline comments and surrounding whitespace
              entry="$(printf '%s\n' "$line" | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$entry" ]; then
                IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $entry"
              fi
            done < "$ALLOWLIST"
          fi
          echo "pip-audit ignore flags: ${IGNORE_FLAGS:-<none>}"
          # shellcheck disable=SC2086
          pip-audit -r backend/requirements.txt --strict --vulnerability-service osv $IGNORE_FLAGS

      - name: Run npm audit (frontend production deps, HIGH+)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

