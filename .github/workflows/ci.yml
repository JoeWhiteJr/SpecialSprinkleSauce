# Wasden Watch CI/CD Pipeline
# Runs lint and tests on push to main and pull requests
#
# Security note: all third-party actions are pinned by full commit SHA
# (matching the PR #21 hardening style). The trailing comment is the
# human-readable version tag the SHA corresponds to. Do NOT replace a
# SHA with a tag — tags are mutable.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secret scanning gate — blocks the rest of the pipeline if any credential
  # material is detected in the diff / repo. Defense-in-depth: complements
  # the local pre-commit hook so a developer who bypasses the hook with
  # `--no-verify` still gets caught at the CI layer.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history is required so gitleaks can scan the push diff
          # (and so its `log-opts` range resolution works correctly).
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks-action exits non-zero when findings exist, which fails
        # the job — exactly the gating behavior we want.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Python Backend Linting and Tests
  backend:
    name: Backend (Python)
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # Aligned with the local development venv (3.12.3). Bumping
          # from 3.11 keeps CI parity with what developers actually run.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check . --select=E,F,W --ignore=E501

      - name: Type check imports
        run: |
          # Verify all imports resolve
          python -c "from app.main import app; print('Backend imports OK')"
        env:
          TRADING_MODE: paper
          USE_MOCK_DATA: "true"

      - name: Run tests
        run: |
          # Run pytest if tests exist.
          # Coverage threshold (--cov-fail-under) is configured in
          # pyproject.toml ([tool.coverage.report] fail_under) so there is
          # ONE source of truth — and the gate enforces locally too, not
          # only in CI. Target: ratchet upward toward 80% by end of pilot
          # trading phase.
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v --tb=short --cov=app --cov=src --cov-report=term --cov-report=xml
          else
            echo "No tests found - skipping"
          fi
        env:
          TRADING_MODE: paper
          USE_MOCK_DATA: "true"

      - name: Upload coverage XML
        # Always upload, even on test failure, so reviewers can inspect
        # which lines are uncovered when triaging a red build.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # Frontend Linting and Build
  frontend:
    name: Frontend (Next.js)
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Thresholds live in `vitest.config.ts` under `test.coverage.thresholds`.
        # Starting floor: 60% lines / 60% functions / 60% statements / 50% branches.
        # Branches are 10 points lower because branch coverage is the
        # noisiest metric (every defensive `if` adds two uncovered arms);
        # we want the gate to bite on real gaps, not on guard clauses.
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  # Dependency Vulnerability Scan (Python + Node)
  # Fails CI on known CVEs in production dependencies.
  # - Python: pip-audit against OSV.dev (no GitHub token required)
  # - Node:   npm audit, HIGH/CRITICAL only, prod deps only
  # Triage workflow on failure: bump version if safe, otherwise add the
  # advisory ID to .github/pip-audit-allowlist.txt with a dated rationale.
  security:
    name: Security (Dependency Vuln Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (Python deps, OSV database, strict)
        run: |
          # Build --ignore-vuln flags from the allowlist file, if any
          # non-comment, non-blank entries exist.
          IGNORE_FLAGS=""
          ALLOWLIST=".github/pip-audit-allowlist.txt"
          if [ -f "$ALLOWLIST" ]; then
            while IFS= read -r line; do
              # strip inline comments and surrounding whitespace
              entry="$(printf '%s\n' "$line" | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$entry" ]; then
                IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $entry"
              fi
            done < "$ALLOWLIST"
          fi
          echo "pip-audit ignore flags: ${IGNORE_FLAGS:-<none>}"
          # shellcheck disable=SC2086
          pip-audit -r backend/requirements.txt --strict --vulnerability-service osv $IGNORE_FLAGS

      - name: Run npm audit (frontend production deps, HIGH+ with allowlist)
        working-directory: frontend
        run: |
          # npm audit doesn't have a native --ignore-id flag, so we run it,
          # capture JSON output, and compare advisory URLs against the
          # repo allowlist at .github/npm-audit-allowlist.txt. Mirrors the
          # pip-audit allowlist pattern for consistency.
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit.json
          AUDIT_EXIT=$?
          set -e

          # Parse allowlist (one GHSA-* per non-blank, non-comment line)
          ALLOWLIST="../.github/npm-audit-allowlist.txt"
          ALLOW_IDS=""
          if [ -f "$ALLOWLIST" ]; then
            ALLOW_IDS=$(grep -v '^#' "$ALLOWLIST" 2>/dev/null \
                        | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                        | grep -v '^$' || true)
          fi
          ALLOW_COUNT=$(echo "$ALLOW_IDS" | grep -c '^GHSA-' || true)
          echo "npm-audit allowlist entries: $ALLOW_COUNT"

          # Pull all HIGH/CRITICAL advisory GHSA IDs from the audit output
          FOUND_IDS=$(jq -r '
            .vulnerabilities | to_entries | .[] |
            select(.value.severity == "high" or .value.severity == "critical") |
            .value.via[] | select(type == "object") | .url' /tmp/npm-audit.json \
            | sed -E 's@.*/(GHSA-[a-z0-9-]+)$@\1@' | sort -u || true)

          # Diff: anything in FOUND_IDS that's NOT in ALLOW_IDS = real failure
          UNALLOWED=$(comm -23 <(echo "$FOUND_IDS") <(echo "$ALLOW_IDS" | sort -u))

          if [ -n "$UNALLOWED" ]; then
            echo "::error::Unallowlisted npm HIGH/CRITICAL advisories detected:"
            echo "$UNALLOWED" | sed 's/^/  - /'
            echo ""
            echo "To fix:"
            echo "  1. Try 'npm audit fix' or bump the parent dep"
            echo "  2. If no safe fix path, add the GHSA ID to .github/npm-audit-allowlist.txt"
            echo "     with a dated rationale and revisit-by date"
            exit 1
          fi
          echo "All HIGH/CRITICAL npm advisories are allowlisted (or none present)."
